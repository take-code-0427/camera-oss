[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowcam"
version = "0.1.0"
description = "Turn camera streams into anonymous foot-traffic metrics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "ultralytics>=8.3,<9",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6,<7",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
flowcam = "flowcam.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
