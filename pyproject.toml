[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "flowcam"
version = "0.1.0"
description = "Turn camera streams into anonymous foot-traffic metrics"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "ultralytics>=8.3,<9",
  "lap>=0.5.12,<1",
  "opencv-python-headless>=4.10,<5",
  "pyyaml>=6,<7",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "ty>=0.0.1a20",
]

[project.scripts]
flowcam = "flowcam.cli:app"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
